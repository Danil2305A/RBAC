name: Java CI with Gradle

on:
  push:
    branches: [ "dev", "feature/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Check Java version
        run: java --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew shadowJar --no-daemon

      - name: Run tests in package com.example.manager
        run: ./gradlew test --tests com.example.manager.*

      - name: Upload test reports (package com.example.manager)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manager-reports-${{ github.run_id }}
          path: |
              **/build/reports/tests/
          retention-days: 30

      - name: Run tests in package com.example.command
        run: ./gradlew test --tests com.example.command.*

      - name: Upload test reports (package com.example.command)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-command-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
          retention-days: 30

      - name: Run tests in package com.example.util
        run: ./gradlew test --tests com.example.util.*

      - name: Upload test reports (package com.example.util)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-util-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
          retention-days: 30

      - name: Run tests in package com.example.auditlog
        run: ./gradlew test --tests com.example.auditlog.*

      - name: Upload test reports (package com.example.auditlog)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-auditlog-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
          retention-days: 30

      - name: Run tests in package com.example.report
        run: ./gradlew test --tests com.example.report.*

      - name: Upload test reports (package com.example.report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
          retention-days: 30